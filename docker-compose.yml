services:
  api:
    build: .
    ports:
      - "8000:8000"

    environment:
      MODEL_PATH: /app/models/model.joblib
      LABELS_PATH: /app/data/raw/medical_tc_labels.csv
      ONNX_MODEL_PATH: /app/models/classifier.onnx

    volumes:
      - ./models:/app/models
      - ./data/raw/medical_tc_labels.csv:/app/data/raw/medical_tc_labels.csv:ro

    depends_on:
      - prometheus

  prometheus:
    image: prom/prometheus:v2.54.1
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro

  grafana:
    image: grafana/grafana:11.2.0
    ports:
      - "3000:3000"
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - prometheus
