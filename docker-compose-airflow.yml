services:
  airflow:
    build:
      context: .
      dockerfile: airflow/Dockerfile

    environment:
      AIRFLOW__CORE__EXECUTOR: SequentialExecutor
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: sqlite:////opt/airflow/airflow.db

      TRAIN_PATH: /opt/airflow/project/data/raw/medical_tc_train.csv
      MODEL_PATH: /opt/airflow/project/models/model.joblib
      MODEL_MODE: streaming
      CSV_CHUNK_SIZE: 5000
      PYTHONPATH: /opt/airflow/project

    volumes:
      - ./airflow/dags:/opt/airflow/dags
      - ./src:/opt/airflow/project/src
      - ./data:/opt/airflow/project/data
      - ./models:/opt/airflow/project/models

    ports:
      - "8080:8080"

    command: >
      bash -c " airflow db migrate && airflow users create --username admin --password admin --firstname Admin --lastname User --role Admin --email admin@example.com || true; airflow webserver & airflow scheduler "
